name: Publish Vieploy image

on:
  push:
    branches: [vieploy]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-vieploy
  cancel-in-progress: true

jobs:
  publish:
    if: github.repository == 'alexec0de/dokploy' && github.ref == 'refs/heads/vieploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare build configuration
        run: |
          cp apps/vieploy/.env.production.example .env.production
          cp apps/vieploy/.env.production.example apps/vieploy/.env.production

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/alexec0de/vieploy:${{ github.sha }}
            ghcr.io/alexec0de/vieploy:vieploy
          labels: |
            org.opencontainers.image.source=https://github.com/alexec0de/dokploy
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
